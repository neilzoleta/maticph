<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Agent Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .chat-panel {
            transform: translateX(100%);
            transition: transform 0.3s ease-in-out;
        }
        
        .chat-panel.open {
            transform: translateX(0);
        }
        
        .chat-panel.minimized {
            transform: translateX(calc(100% - 60px));
        }
        
        .fade-in {
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .pulse-dot {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #9CA3AF;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 to-black min-h-screen">
    <!-- Main Content -->
    <div class="container mx-auto px-6 py-12">
        <div class="text-center">
            <h1 class="text-4xl font-bold text-white mb-4">Welcome to Our Platform</h1>
            <p class="text-xl text-gray-300 mb-8">Need help? Our AI chat agent is here to assist you 24/7</p>
            <div class="bg-gray-900 border border-gray-700 rounded-lg shadow-lg p-8 max-w-2xl mx-auto">
                <h2 class="text-2xl font-semibold text-white mb-4">How can we help you today?</h2>
                <p class="text-gray-300">Click the chat button in the bottom right corner to start a conversation with our support team.</p>
            </div>
        </div>
    </div>

    <!-- Floating CTA Button -->
    <button id="chatButton" class="fixed bottom-6 right-6 bg-blue-600 hover:bg-blue-700 text-white rounded-full p-4 shadow-lg transition-all duration-300 hover:scale-110 z-40">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
        </svg>
        <div class="absolute -top-1 -right-1 w-3 h-3 bg-green-500 rounded-full pulse-dot"></div>
    </button>

    <!-- Chat Panel -->
    <div id="chatPanel" class="chat-panel fixed top-0 right-0 h-full w-96 bg-gray-900 shadow-2xl z-50 flex flex-col">
        <!-- Header -->
        <div class="bg-gray-800 text-white p-4 flex items-center justify-between border-b border-gray-700">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2ZM21 9V7L15 1H5C3.89 1 3 1.89 3 3V7H9V9H21ZM12 8C8.69 8 6 10.69 6 14S8.69 20 12 20 18 17.31 18 14 15.31 8 12 8ZM12 18C9.79 18 8 16.21 8 14S9.79 10 12 10 16 11.79 16 14 14.21 18 12 18Z"/>
                    </svg>
                </div>
                <div>
                    <h3 class="font-semibold">Chat Support</h3>
                    <p class="text-sm text-gray-300">Online now</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="resetBtn" class="hover:bg-gray-700 p-1 rounded transition-colors" title="Reset Chat">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
                <button id="minimizeBtn" class="hover:bg-gray-700 p-1 rounded transition-colors" title="Minimize">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path>
                    </svg>
                </button>
                <button id="closeBtn" class="hover:bg-gray-700 p-1 rounded transition-colors" title="Close">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Chat Messages -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-900">
            <div class="flex items-start space-x-3 fade-in">
                <div class="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center flex-shrink-0">
                    <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2Z"/>
                    </svg>
                </div>
                <div class="bg-gray-800 border border-gray-700 rounded-lg p-3 shadow-sm max-w-xs">
                    <p class="text-gray-200">Hello! I'm your AI assistant. How can I help you today?</p>
                    <span class="text-xs text-gray-400 mt-1 block">Just now</span>
                </div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div id="typingIndicator" class="px-4 py-2 hidden">
            <div class="flex items-start space-x-3">
                <div class="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center flex-shrink-0">
                    <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2Z"/>
                    </svg>
                </div>
                <div class="bg-gray-800 border border-gray-700 rounded-lg p-3 shadow-sm">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-4 border-t border-gray-700 bg-gray-800">
            <div class="flex items-center space-x-3">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type your message..." 
                    class="flex-1 border border-gray-600 bg-gray-700 text-white placeholder-gray-400 rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:border-transparent"
                >
                <button id="sendBtn" class="bg-gray-600 hover:bg-gray-500 text-white rounded-full p-2 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden"></div>

    <script>
        const chatButton = document.getElementById('chatButton');
        const chatPanel = document.getElementById('chatPanel');
        const closeBtn = document.getElementById('closeBtn');
        const minimizeBtn = document.getElementById('minimizeBtn');
        const resetBtn = document.getElementById('resetBtn');
        const overlay = document.getElementById('overlay');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatMessages = document.getElementById('chatMessages');
        const typingIndicator = document.getElementById('typingIndicator');

        let isMinimized = false;
        let isOpen = false;

        // Open chat panel
        chatButton.addEventListener('click', () => {
            chatPanel.classList.add('open');
            overlay.classList.remove('hidden');
            chatButton.style.display = 'none';
            isOpen = true;
            isMinimized = false;
            messageInput.focus();
        });

        // Close chat panel
        closeBtn.addEventListener('click', () => {
            chatPanel.classList.remove('open', 'minimized');
            overlay.classList.add('hidden');
            chatButton.style.display = 'block';
            isOpen = false;
            isMinimized = false;
        });

        // Minimize chat panel
        minimizeBtn.addEventListener('click', () => {
            if (isMinimized) {
                chatPanel.classList.remove('minimized');
                chatPanel.classList.add('open');
                isMinimized = false;
            } else {
                chatPanel.classList.remove('open');
                chatPanel.classList.add('minimized');
                isMinimized = true;
            }
        });

        // Click minimized panel to restore
        chatPanel.addEventListener('click', (e) => {
            if (isMinimized && e.target.closest('#minimizeBtn, #closeBtn') === null) {
                chatPanel.classList.remove('minimized');
                chatPanel.classList.add('open');
                isMinimized = false;
                messageInput.focus();
            }
        });

        // Reset chat
        resetBtn.addEventListener('click', () => {
            // Clear all messages except the initial greeting
            chatMessages.innerHTML = `
                <div class="flex items-start space-x-3 fade-in">
                    <div class="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center flex-shrink-0">
                        <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2Z"/>
                        </svg>
                    </div>
                    <div class="bg-gray-800 border border-gray-700 rounded-lg p-3 shadow-sm max-w-xs">
                        <p class="text-gray-200">Hello! I'm your AI assistant. How can I help you today?</p>
                        <span class="text-xs text-gray-400 mt-1 block">Just now</span>
                    </div>
                </div>
            `;
            // Hide typing indicator if visible
            typingIndicator.classList.add('hidden');
            // Clear input field
            messageInput.value = '';
            // Focus on input
            messageInput.focus();
        });

        // Close on overlay click
        overlay.addEventListener('click', () => {
            if (!isMinimized) {
                closeBtn.click();
            }
        });

        // Send message function
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message) {
                // Add user message
                const userMessage = document.createElement('div');
                userMessage.className = 'flex items-start space-x-3 justify-end fade-in';
                userMessage.innerHTML = `
                    <div class="bg-gray-700 border border-gray-600 text-white rounded-lg p-3 shadow-sm max-w-xs">
                        <p>${message}</p>
                        <span class="text-xs text-gray-300 mt-1 block">Just now</span>
                    </div>
                    <div class="w-8 h-8 bg-gray-600 rounded-full flex items-center justify-center flex-shrink-0">
                        <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                    </div>
                `;
                chatMessages.appendChild(userMessage);
                messageInput.value = '';

                // Show typing indicator
                typingIndicator.classList.remove('hidden');
                chatMessages.scrollTop = chatMessages.scrollHeight;

                // Simulate AI response
                setTimeout(() => {
                    typingIndicator.classList.add('hidden');
                    const aiResponse = document.createElement('div');
                    aiResponse.className = 'flex items-start space-x-3 fade-in';
                    
                    const responses = [
                        "Thanks for your message! I'm here to help you with any questions you might have.",
                        "I understand your concern. Let me provide you with the information you need.",
                        "That's a great question! I'd be happy to assist you with that.",
                        "I'm processing your request. Is there anything specific you'd like to know more about?"
                    ];
                    
                    const randomResponse = responses[Math.floor(Math.random() * responses.length)];
                    
                    aiResponse.innerHTML = `
                        <div class="w-8 h-8 bg-gray-700 rounded-full flex items-center justify-center flex-shrink-0">
                            <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2C13.1 2 14 2.9 14 4C14 5.1 13.1 6 12 6C10.9 6 10 5.1 10 4C10 2.9 10.9 2 12 2Z"/>
                            </svg>
                        </div>
                        <div class="bg-gray-800 border border-gray-700 rounded-lg p-3 shadow-sm max-w-xs">
                            <p class="text-gray-200">${randomResponse}</p>
                            <span class="text-xs text-gray-400 mt-1 block">Just now</span>
                        </div>
                    `;
                    chatMessages.appendChild(aiResponse);
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }, 2000);
            }
        }

        // Send message on button click
        sendBtn.addEventListener('click', sendMessage);

        // Send message on Enter key
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Auto-scroll to bottom
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Initial scroll
        scrollToBottom();
    </script>
</body>
</html>
