<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MATICSTUDIO.net – Live</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #ffffff;
      color: #000000;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .logo-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 960px;
      justify-content: flex-start;
      margin-bottom: 14px;
    }

    .logo-wrapper img {
      height: 50px;
      width: auto;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #ff4444;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      background: #ff4444;
      border-radius: 50%;
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(1.3); }
    }

    .player-container {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.08);
      background: #1a1a1a;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>

  <!-- Logo + Live badge (aligned above player) -->
  <div class="logo-wrapper">
    <img src="/assets/1-removebg-preview.png" alt="MATICSTUDIO.net" />
    <div class="live-badge">
      <span class="live-dot"></span>
      Live
    </div>
  </div>

  <!-- YouTube Live Embed -->
  <div class="player-container">
    <iframe
      src="https://www.youtube.com/embed/YOUR_VIDEO_OR_STREAM_ID?autoplay=1&mute=1"
      title="MATICSTUDIO Live Stream"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <footer>&copy; 2025 MATICSTUDIO.net</footer>

</body>
</html>
