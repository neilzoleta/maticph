<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MATIC Studio | Direct Reports</title>
  <link rel="icon" href="/assets/favicon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000;
      --panel: #111;
      --text: #fff;
      --accent: #e60012;
      --muted: #ccc;
      --soft: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 40px 20px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
    }

    .logo img {
      height: 40px;
    }

    .nav {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      padding: 10px 16px;
      border-radius: 12px;
      transition: background 0.3s ease;
    }

    .nav a:hover, .nav a.active {
      background: var(--soft);
    }

    .profile {
      position: relative;
      margin-left: 10px;
    }

    .profile-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e60012;
      color: white;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .profile-dropdown {
      position: absolute;
      right: 0;
      top: 50px;
      background: var(--panel);
      border: 1px solid var(--soft);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      display: none;
      flex-direction: column;
      min-width: 150px;
      z-index: 999;
    }

    .profile-dropdown a {
      padding: 10px 16px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      transition: background 0.3s ease;
    }

    .profile-dropdown a:hover {
      background: var(--soft);
    }

    .profile.show .profile-dropdown {
      display: flex;
    }

    .section {
      background: var(--panel);
      border: 1px solid var(--soft);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 40px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .section h2 {
      font-size: 1.5rem;
      margin-bottom: 16px;
      font-weight: 600;
    }

    .add-btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .add-btn:hover {
      background-color: #b3000e;
    }

    .section p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .card-grid {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-top: 24px;
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--soft);
      border-radius: 16px;
      padding: 20px;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
    }

    .card h3 {
      margin-bottom: 10px;
      color: var(--text);
    }

    .card p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .nav {
        width: 100%;
        justify-content: center;
      }
    }
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal {
      background: #fff;
      color: #000;
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .close-button {
      position: absolute;
      top: 12px;
      right: -16px;
      background: none;
      border: none;
      font-size: 28px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }

    .close-button:hover {
      color: var(--accent);
    }
    #modalActions {
      margin-top: 30px;
      text-align: right;
    }
    #modalActions button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-left: 10px;
      transition: background-color 0.3s ease;
    }
    #modalActions button:hover {
      background-color: #b3000e;
    }

    /* MATIC Studio Aesthetic for modal buttons and inputs */
    .modal button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 500;
      margin-top: 6px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .modal button:hover {
      background-color: #b3000e;
    }

    .modal input[type="text"],
    .modal input[type="email"],
    .modal input[type="date"],
    .modal input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    .modal label {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 4px;
      display: block;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <img src="../assets/logo.png" alt="MATIC Studio Logo">
      </div>
      <nav class="nav">
        <a href="employee-admin.html">Dashboard</a>
        <a href="#" class="active" >Employees</a>
        <a href="#">Departments</a>
        <a href="#">Compensation</a>
        <a href="#">Absence Request</a>
        <div class="profile" id="profile">
          <div class="profile-icon" onclick="toggleDropdown()">U</div>
          <div class="profile-dropdown" id="profileDropdown">
            <a href="#">Settings</a>
            <a href="#">Logout</a>
          </div>
        </div>
      </nav>
    </div>

    <div class="section">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Employees</h2>
        <button class="add-btn" onclick="openModal()">+ New Employee</button>
      </div>
    </div>
    <div class="card-grid" id="employeeList"></div>
  </div>

  <div id="addModal" class="modal-backdrop" style="display: none;">
    <div class="modal">
      <button class="close-button" onclick="closeModal()">&times;</button>
      <h2 style="margin-bottom: 16px;">Add New Employee</h2>
      <form onsubmit="addEmployee(event)">
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
          <div style="flex: 1;">
            <label for="empFirstName">First Name</label>
            <input type="text" id="empFirstName" required style="flex: 1;" />
          </div>
          <div style="flex: 1;">
            <label for="empLastName">Last Name</label>
            <input type="text" id="empLastName" required style="flex: 1;" />
          </div>
        </div>
        <div>
          <label for="empEmail">Email</label>
          <input type="email" id="empEmail" required />
        </div>
        <div>
          <label for="empDept">Department</label>
          <input type="text" id="empDept" required />
        </div>
        <div>
          <label for="empRole">Role</label>
          <input type="text" id="empRole" required />
        </div>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
          <div style="flex: 1;">
            <label for="empUsername">Username</label>
            <div style="display: flex; align-items: center; border: 1px solid rgba(200,200,200,1); background: white; border-radius: 6px; padding: 0 12px; height: 42px; box-sizing: border-box;">
              <input type="text" id="empUsername" required style="border: none; outline: none; flex: 1; font-size: 14px;" />
              <span style="color: #777; font-size: 13px; margin-left: 8px;">@maticstudio.net</span>
            </div>
          </div>
          <div style="flex: 1;">
            <label for="empPassword">Password</label>
            <div style="display: flex; align-items: center; border: 1px solid rgba(200,200,200,1); background: white; border-radius: 6px; padding: 0 12px; height: 42px; box-sizing: border-box;">
              <input type="password" id="empPassword" required style="border: none; outline: none; flex: 1; font-size: 14px;" />
            </div>
          </div>
        </div>
        <button type="submit">Add Employee</button>
      </form>
    </div>
  </div>

  <div id="editModal" class="modal-backdrop" style="display: none;">
    <div class="modal">
      <button class="close-button" onclick="closeEditModal()">&times;</button>
      <h2 style="margin-bottom: 16px;">Edit Employee</h2>
      <form onsubmit="saveEditedEmployee(event)">
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
          <div style="flex: 1;">
            <label for="editFirstName">First Name</label>
            <input type="text" id="editFirstName" required style="flex: 1;" />
          </div>
          <div style="flex: 1;">
            <label for="editLastName">Last Name</label>
            <input type="text" id="editLastName" required style="flex: 1;" />
          </div>
        </div>
        <div>
          <label for="editEmail">Email</label>
          <input type="email" id="editEmail" required />
        </div>
        <div>
          <label for="editDept">Department</label>
          <input type="text" id="editDept" required />
        </div>
        <div>
          <label for="editRole">Role</label>
          <input type="text" id="editRole" required />
        </div>
        <div>
          <label for="editUsername">Username</label>
          <input type="text" id="editUsername" readonly style="margin-bottom: 10px;" />
        </div>
        <button type="submit">Save Changes</button>
      </form>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById("addModal").style.display = "flex";
    }

    function closeModal() {
      document.getElementById("addModal").style.display = "none";
    }

    function addEmployee(event) {
      event.preventDefault();
      const firstName = document.getElementById("empFirstName").value;
      const lastName = document.getElementById("empLastName").value;
      const name = firstName + " " + lastName;
      const email = document.getElementById("empEmail").value;
      const dept = document.getElementById("empDept").value;
      const role = document.getElementById("empRole").value;
      const username = document.getElementById("empUsername").value;
      const password = document.getElementById("empPassword").value;

      console.log("New employee:", { name, email, dept, role, username, password });

      // Add new employee card to employeeList
      const employeeList = document.getElementById("employeeList");
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div style="display: flex; justify-content: space-between; align-items: start;">
          <div>
            <h3>${name}</h3>
            <p>${role} — ${dept}</p>
            <p>Email: ${email}</p>
            <p>Username: ${username}@maticstudio.net</p>
          </div>
          <div style="display: flex; gap: 10px;">
            <button onclick="editCard(this)" style="background: none; border: none; cursor: pointer; color: white; font-weight: 500;" title="Edit">
              Edit
            </button>
            <button onclick="deleteCard(this)" style="background: none; border: none; cursor: pointer; color: white; font-weight: 500;" title="Delete">
              Delete
            </button>
          </div>
        </div>
      `;
      employeeList.appendChild(card);

      alert("Employee added!");
      event.target.reset();
      closeModal();
    }

    function deleteCard(button) {
      const card = button.closest('.card');
      if (confirm("Are you sure you want to delete this employee?")) {
        card.remove();
      }
    }

    let currentEditingCard = null;

    function editCard(button) {
      const card = button.closest('.card');
      currentEditingCard = card;
      const name = card.querySelector('h3').innerText.split(' ');
      const firstName = name[0];
      const lastName = name.slice(1).join(' ');
      const email = card.querySelectorAll('p')[1].innerText.replace('Email: ', '');
      const dept = card.querySelectorAll('p')[0].innerText.split(' — ')[1];
      const role = card.querySelectorAll('p')[0].innerText.split(' — ')[0];
      const username = card.querySelectorAll('p')[2].innerText.replace('Username: ', '').replace('@maticstudio.net', '');

      document.getElementById('editFirstName').value = firstName;
      document.getElementById('editLastName').value = lastName;
      document.getElementById('editEmail').value = email;
      document.getElementById('editDept').value = dept;
      document.getElementById('editRole').value = role;
      document.getElementById('editUsername').value = username + '@maticstudio.net';

      document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    function saveEditedEmployee(event) {
      event.preventDefault();
      const name = document.getElementById('editFirstName').value + ' ' + document.getElementById('editLastName').value;
      const email = document.getElementById('editEmail').value;
      const dept = document.getElementById('editDept').value;
      const role = document.getElementById('editRole').value;

      const card = currentEditingCard;
      card.querySelector('h3').innerText = name;
      card.querySelectorAll('p')[0].innerText = `${role} — ${dept}`;
      card.querySelectorAll('p')[1].innerText = `Email: ${email}`;

      closeEditModal();
    }
  </script>
<div id="settingsModal" class="modal-backdrop" style="display: none;">
    <div class="modal">
      <button onclick="closeSettingsModal()" class="close-button">&times;</button>
      <h1 style="cursor: pointer;" onclick="toggleEditInfo()">Personal Settings</h1>
      <div id="personalInfo" style="display: none;">
        <p>Name: <input type="text" /></p>
        <p>Date of Birth: <input type="date" /></p>
        <p>Marital Status: <input type="text" /></p>
        <p>Department: <input type="text" /></p>
        <p>Role: <input type="text" /></p>
        <div class="modalActions" style="margin-top: 30px; text-align: right;">
          <button onclick="saveChanges()">Save Changes</button>
          <button onclick="cancelChanges()">Cancel</button>
        </div>
      </div>

      <h1 style="cursor: pointer; margin-top: 24px;" onclick="togglePassword()">Password</h1>
      <div id="passwordSection" style="display: none;">
        <p>Old Password: <input type="password" /></p>
        <p>New Password: <input type="password" /></p>
        <p>Confirm Password: <input type="password" /></p>
        <div class="modalActions" style="margin-top: 30px; text-align: right;">
          <button onclick="saveChanges()">Save Changes</button>
          <button onclick="cancelChanges()">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function toggleDropdown() {
      const profile = document.getElementById("profile");
      profile.classList.toggle("show");
    }

    document.addEventListener("click", function(e) {
      const profile = document.getElementById("profile");
      const dropdown = document.getElementById("profileDropdown");
      if (!profile.contains(e.target)) {
        profile.classList.remove("show");
      }
    });

    document.querySelector('#profileDropdown a[href="#"]').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('settingsModal').style.display = 'flex';
    });

    function toggleEditInfo() {
      const info = document.getElementById('personalInfo');
      const password = document.getElementById('passwordSection');

      info.style.display = 'block';
      password.style.display = 'none';
    }

    function togglePassword() {
      const info = document.getElementById('personalInfo');
      const password = document.getElementById('passwordSection');

      password.style.display = 'block';
      info.style.display = 'none';
    }

    function cancelChanges() {
      document.getElementById('personalInfo').style.display = 'none';
      document.getElementById('passwordSection').style.display = 'none';
    }

    function saveChanges() {
      alert('Changes saved!');
      cancelChanges();
    }

    // Only hide the settings modal and reset when closing settings modal
    function closeSettingsModal() {
      document.getElementById('settingsModal').style.display = 'none';
      cancelChanges();
    }
  </script>
</body>
</html>
