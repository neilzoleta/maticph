<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MATIC Studio - Schedule Meeting</title>
  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --gray: #aaa;
      --accent: #e5e5e5;
      --hover: #ccc;
      --glow: #00ffff;
      --shadow: rgba(0, 255, 255, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      letter-spacing: 0.02em;
      min-height: 100vh;
    }

    .scheduler-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .scheduler-modal.active {
      opacity: 1;
      visibility: visible;
    }

    .scheduler-content {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 20px 60px rgba(0, 255, 255, 0.2);
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: rgba(255, 0, 0, 0.9);
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .close-btn:hover {
      background: rgba(255, 0, 0, 1);
      transform: scale(1.1);
    }

    .scheduler-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .scheduler-header h2 {
      font-size: 2em;
      margin-bottom: 10px;
      color: var(--accent);
    }

    .scheduler-header p {
      color: var(--gray);
      font-size: 1.1em;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--accent);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: var(--text);
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--glow);
      box-shadow: 0 0 0 3px rgba(0, 255, 255, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }

    .time-slots {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .time-slot {
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .time-slot:hover {
      background: rgba(0, 255, 255, 0.2);
      border-color: var(--glow);
    }

    .time-slot.selected {
      background: var(--glow);
      color: var(--bg);
      border-color: var(--glow);
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--glow), #0080ff);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 255, 255, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .success-message {
      text-align: center;
      color: #00ff88;
      margin-top: 20px;
      padding: 15px;
      background: rgba(0, 255, 136, 0.1);
      border-radius: 8px;
      display: none;
    }

    .error-message {
      text-align: center;
      color: #ff4444;
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 68, 68, 0.1);
      border-radius: 8px;
      display: none;
    }

    @media (max-width: 768px) {
      .scheduler-content {
        padding: 30px 20px;
        margin: 20px;
      }
      
      .time-slots {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="scheduler-modal" id="schedulerModal">
    <div class="scheduler-content">
      <div class="close-btn" onclick="closeScheduler()">✕</div>
      
      <div class="scheduler-header">
        <h2>Schedule Tune-Up Call</h2>
        <p>Book a 30-minute consultation with MATIC Studio</p>
      </div>

      <form id="schedulerForm">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="company">Company Name</label>
          <input type="text" id="company" name="company">
        </div>

        <div class="form-group">
          <label for="date">Preferred Date *</label>
          <input type="date" id="date" name="date" required min="">
        </div>

        <div class="form-group">
          <label>Preferred Time *</label>
          <div class="time-slots">
            <div class="time-slot" data-time="09:00">9:00 AM</div>
            <div class="time-slot" data-time="10:00">10:00 AM</div>
            <div class="time-slot" data-time="11:00">11:00 AM</div>
            <div class="time-slot" data-time="13:00">1:00 PM</div>
            <div class="time-slot" data-time="14:00">2:00 PM</div>
            <div class="time-slot" data-time="15:00">3:00 PM</div>
            <div class="time-slot" data-time="16:00">4:00 PM</div>
            <div class="time-slot" data-time="17:00">5:00 PM</div>
          </div>
        </div>

        <div class="form-group">
          <label for="topic">What would you like to discuss? *</label>
          <textarea id="topic" name="topic" placeholder="Tell us about your automation needs, current challenges, or specific questions..." required></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          Schedule Meeting
        </button>
      </form>

      <div class="success-message" id="successMessage">
        Meeting scheduled successfully! Check your email for Google Meet details.
      </div>

      <div class="error-message" id="errorMessage">
        There was an error scheduling your meeting. Please try again.
      </div>
    </div>
  </div>

  <script>
    // Set minimum date to today
    document.getElementById('date').min = new Date().toISOString().split('T')[0];

    // Time slot selection
    const timeSlots = document.querySelectorAll('.time-slot');
    timeSlots.forEach(slot => {
      slot.addEventListener('click', () => {
        timeSlots.forEach(s => s.classList.remove('selected'));
        slot.classList.add('selected');
      });
    });

    // Form submission
    document.getElementById('schedulerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const successMessage = document.getElementById('successMessage');
      const errorMessage = document.getElementById('errorMessage');
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Scheduling...';
      
      // Get form data
      const formData = new FormData(e.target);
      const selectedTime = document.querySelector('.time-slot.selected');
      
      if (!selectedTime) {
        showError('Please select a preferred time.');
        return;
      }
      
      const meetingData = {
        name: formData.get('name'),
        email: formData.get('email'),
        company: formData.get('company'),
        date: formData.get('date'),
        time: selectedTime.dataset.time,
        topic: formData.get('topic')
      };

      try {
        // Here you would integrate with your backend API
        // For now, we'll simulate a successful response
        await simulateScheduling(meetingData);
        
        showSuccess();
        e.target.reset();
        timeSlots.forEach(s => s.classList.remove('selected'));
        
        // Close modal after 3 seconds
        setTimeout(() => {
          closeScheduler();
        }, 3000);
        
      } catch (error) {
        showError('Failed to schedule meeting. Please try again.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Schedule Meeting';
      }
    });

    function showSuccess() {
      document.getElementById('successMessage').style.display = 'block';
      document.getElementById('errorMessage').style.display = 'none';
    }

    function showError(message) {
      const errorEl = document.getElementById('errorMessage');
      errorEl.textContent = message;
      errorEl.style.display = 'block';
      document.getElementById('successMessage').style.display = 'none';
    }

    async function simulateScheduling(data) {
      // Simulate API call delay
      await new Promise(resolve => setTimeout(resolve, 2000));
      
      // In a real implementation, you would:
      // 1. Send data to your backend
      // 2. Backend creates Google Calendar event with Google Meet
      // 3. Backend sends confirmation email with meeting details
      // 4. Return success response
      
      console.log('Meeting data:', data);
      return { success: true };
    }

    // Modal functions
    function openScheduler() {
      document.getElementById('schedulerModal').classList.add('active');
    }

    function closeScheduler() {
      document.getElementById('schedulerModal').classList.remove('active');
      document.getElementById('successMessage').style.display = 'none';
      document.getElementById('errorMessage').style.display = 'none';
    }

    // Close modal when clicking outside
    document.getElementById('schedulerModal').addEventListener('click', (e) => {
      if (e.target.id === 'schedulerModal') {
        closeScheduler();
      }
    });

    // Make functions globally available
    window.openScheduler = openScheduler;
    window.closeScheduler = closeScheduler;
  </script>
<script src="/website-integration.js"></script>
</body>
</html>
